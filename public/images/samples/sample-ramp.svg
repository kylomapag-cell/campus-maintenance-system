<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Ramp structure -->
  <polygon points="100,320 500,240 500,320" fill="#475569"/>
  <line x1="100" y1="260" x2="500" y2="180" stroke="#f59e0b" stroke-width="8"/>
  <line x1="200" y1="240" x2="200" y2="300" stroke="#f59e0b" stroke-width="6"/>
  <line x1="340" y1="210" x2="340" y2="270" stroke="#f59e0b" stroke-width="6"/>
  <line x1="460" y1="188" x2="460" y2="250" stroke="#ef4444" stroke-width="6" stroke-dasharray="6 6"/>
  <!-- Warning badge -->
  <circle cx="460" cy="180" r="24" fill="#ef4444"/>
